{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Customer Query Manager{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'frontend/style.css' %}">
</head>
<body>

<div class="header">
    <a href="/queries/" class="logo">Customer Query Manager</a>
    {% block nav %}
        <span id="nav-user"></span>
        <a href="#" id="logout-link">Logout</a>
    {% endblock %}
</div>

<div class="container {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
</div>

<script src="{% static 'frontend/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
